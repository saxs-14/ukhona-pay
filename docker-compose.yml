services:
  postgres:
    image: postgres:16-alpine
    container_name: ukhonapay-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukhonapay"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_DB: ukhonapay
      POSTGRES_USER: ukhonapay
      POSTGRES_PASSWORD: ukhonapay
    ports:
      - "5442:5432"
    volumes:
      - ukhonapay_pgdata:/var/lib/postgresql/data
      - ./DATABASE/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  ukhonapay_pgdata:
