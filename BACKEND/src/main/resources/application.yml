server:
  port: ${PORT:8080}

spring:
  application:
    name: ukhona-pay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5442/ukhonapay}
    username: ${DB_USERNAME:ukhonapay}
    password: ${DB_PASSWORD:ukhonapay}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

ukhonapay:
  mode: ${UKHONA_PAY_MODE:live}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  payments:
    provider: ${PAYMENT_PROVIDER:}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    ozow:
      base-url: ${OZOW_BASE_URL:https://one.ozow.com/v1}
      client-id: ${OZOW_CLIENT_ID:}
      client-secret: ${OZOW_CLIENT_SECRET:}
      site-code: ${OZOW_SITE_CODE:}
      scope: ${OZOW_SCOPE:payments}
      payout-base-url: ${OZOW_PAYOUT_BASE_URL:https://payoutsapi.ozow.com/v1}
      payout-api-key: ${OZOW_PAYOUT_API_KEY:}

logging:
  level:
    co.za.ukhonapay: INFO
