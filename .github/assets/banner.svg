    <g transform="translate(230 152)"><g class="fx" filter="url(#glow)"><g fill="#E4AA92"><rect x="0" y="-50" width="20" height="20"/><rect x="40" y="-50" width="20" height="20"/><rect x="0" y="-10" width="20" height="20"/><rect x="5" y="-45" width="10" height="10" fill="#21100D"/><rect x="45" y="-45" width="10" height="10" fill="#21100D"/><rect x="5" y="-5" width="10" height="10" fill="#21100D"/><rect x="28" y="-22" width="8" height="8" fill="#C2410C"/><rect x="44" y="-6" width="8" height="8" fill="#C2410C"/><rect x="28" y="2" width="8" height="8"/></g></g></g>
    <text x="1000" y="150" text-anchor="end" font-family="Consolas,monospace" font-size="30" fill="#E4AA92" fill-opacity="0.55">{ }</text>
