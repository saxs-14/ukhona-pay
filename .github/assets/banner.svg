<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Ukhona Pay - QR payments for local markets · EDHE Hackathon 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="0.55" stop-color="#21100D"/><stop offset="1" stop-color="#511E0D"/></linearGradient>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#E4AA92"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C2410C" stroke-opacity="0.12"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="1200" height="260" rx="18"/></clipPath>
    <style>
      .tr { fill: none; stroke: #C2410C; stroke-width: 2; stroke-opacity: 0.45; }
      .fl { fill: none; stroke: #E4AA92; stroke-width: 2.5; stroke-dasharray: 14 220; animation: f 4s linear infinite; }
      .fl.b { animation-duration: 5.5s; animation-delay: -2s; }
      .nd { fill: #21100D; stroke: #C2410C; stroke-width: 2; }
      .bn { font-family: Consolas,'Courier New',monospace; font-size: 13px; fill: #C2410C; fill-opacity: 0.3; }
      .fx { animation: y 6s ease-in-out infinite; }
      .cu { animation: k 1s steps(1) infinite; }
      @keyframes f { from { stroke-dashoffset: 234; } to { stroke-dashoffset: 0; } }
      @keyframes y { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes k { 50% { opacity: 0; } }
    </style>
  </defs>
