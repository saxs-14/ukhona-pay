name: CI Build & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Clean Contributor Attribution
        run: |
          if git log -n 100 --format="%ae %B" | grep -Ei "saxs\.solutions25|Co-Authored-By:\s*Claude"; then
            echo "::error::Forbidden author or co-author found in commit history!"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FRONTEND/package-lock.json
      - name: Install Frontend Dependencies
        run: |
          cd FRONTEND
          npm ci
      - name: Build Frontend (Vite)
        run: |
          cd FRONTEND
          npm run build

  build-backend:
    name: Compile Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile Backend (Maven)
        run: |
          cd BACKEND
          mvn -B clean compile
