name: CI Build & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Clean Contributor Attribution
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50 2>/dev/null || true
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-n 20"
          fi
          echo "Checking commits in range: $RANGE"
          if git log $RANGE --format="%ae %B" | grep -Ei "saxs\.solutions25|Co-Authored-By:\s*Claude"; then
            echo "::error::Forbidden author or co-author found in the commits being pushed!"
            exit 1
          fi
          echo "Attribution check passed."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FRONTEND/package-lock.json
      - name: Install Frontend Dependencies
        run: |
          cd FRONTEND
          npm ci
      - name: Build Frontend (Vite)
        run: |
          cd FRONTEND
          npm run build

  build-backend:
    name: Compile Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile Backend (Maven)
        run: |
          cd BACKEND
          mvn -B clean compile
