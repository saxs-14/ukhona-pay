name: Deploy Backend to Cloud Run

# Mirrors how Vercel deploys the frontend from this same GitHub repo: a push
# to main is the trigger, GitHub is the source of truth, no separate manual
# upload step. Scoped to BACKEND/** so a frontend-only push doesn't rebuild
# and redeploy the backend for no reason.
on:
  push:
    branches: [main]
    paths:
      - "BACKEND/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  REGION: us-central1
  SERVICE: ukhona-pay-backend
  REPOSITORY: ukhona-pay-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image via Cloud Build
        run: |
          gcloud builds submit BACKEND \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tag=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --set-env-vars="FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}"

      - name: Print deployed URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"
