name: Deploy Backend to Cloud Run

# Mirrors how Vercel deploys the frontend from this same GitHub repo: a push
# to main is the trigger, GitHub is the source of truth, no separate manual
# upload step. Scoped to BACKEND/** so a frontend-only push doesn't rebuild
# and redeploy the backend for no reason.
on:
  push:
    branches: [main]
    paths:
      - "BACKEND/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  REGION: us-central1
  SERVICE: ukhona-pay-backend
  REPOSITORY: ukhona-pay-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image via Cloud Build
        # --async + poll instead of letting gcloud stream logs directly: log
        # streaming needs project Viewer/Owner on the caller, which this
        # deploy-only service account deliberately doesn't have. The build
        # itself doesn't need that permission, only watching it live does.
        run: |
          BUILD_ID=$(gcloud builds submit BACKEND \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --tag=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --async --format="value(id)")
          echo "Build submitted: $BUILD_ID - polling for completion..."
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project=${{ secrets.GCP_PROJECT_ID }} --format="value(status)")
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "::error::Build $STATUS"; exit 1 ;;
            esac
            sleep 10
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,UKHONA_PAY_MODE=live,FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }},CORS_ALLOWED_ORIGINS=${{ secrets.FRONTEND_BASE_URL }}" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \\
            --set-env-vars="PAYMENT_PROVIDER=${{ secrets.PAYMENT_PROVIDER }},PAYMENT_WEBHOOK_SECRET=${{ secrets.PAYMENT_WEBHOOK_SECRET }}" \\
            --set-env-vars="OZOW_CLIENT_ID=${{ secrets.OZOW_CLIENT_ID }},OZOW_CLIENT_SECRET=${{ secrets.OZOW_CLIENT_SECRET }},OZOW_SITE_CODE=${{ secrets.OZOW_SITE_CODE }},OZOW_SCOPE=${{ secrets.OZOW_SCOPE }},OZOW_REFUND_SCOPE=${{ secrets.OZOW_REFUND_SCOPE }}" \\
            --set-env-vars="OZOW_PAYOUT_API_KEY=${{ secrets.OZOW_PAYOUT_API_KEY }},OZOW_PAYOUT_MASTER_KEY=${{ secrets.OZOW_PAYOUT_MASTER_KEY }},OZOW_PAYOUT_NOTIFY_URL=${{ secrets.OZOW_PAYOUT_NOTIFY_URL }},OZOW_PAYOUT_VERIFICATION_URL=${{ secrets.OZOW_PAYOUT_VERIFICATION_URL }},OZOW_PAYOUT_VERIFICATION_ACCESS_TOKEN=${{ secrets.OZOW_PAYOUT_VERIFICATION_ACCESS_TOKEN }},OZOW_PAYOUT_IS_RTC=${{ secrets.OZOW_PAYOUT_IS_RTC }}"

      - name: Print deployed URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"
